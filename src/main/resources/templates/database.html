<!doctype html>
<html
  lang="hu"
  xmlns:th="http://www.thymeleaf.org"
>
  <head th:replace="~{head :: head('MoziDB - Adatbázis')}"></head>

  <body class="is-preload">
    <div id="page-wrapper">
      <div id="header-wrapper">
        <div th:replace="~{menu :: menu}"></div>
      </div>

      <div id="main-wrapper">
        <div class="container">
          <section class="box last">
            <header class="page-header">
              <h2>Mozi adatbázis</h2>

              <p>Az adatbázis három táblájának tartalma.</p>
            </header>

            <h3>Filmek</h3>

            <div class="table-wrapper scroll">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Cím</th>
                    <th>Év</th>
                    <th>Hossz</th>
                  </tr>
                </thead>

                <tbody>
                  <tr th:each="film : ${filmek}">
                    <td th:text="${film.id}"></td>
                    <td th:text="${film.cim}"></td>
                    <td th:text="${film.ev}"></td>
                    <td th:text="${film.hossz}"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <h3>Mozik</h3>

            <div class="table-wrapper scroll">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Név</th>
                    <th>Város</th>
                    <th>Férőhely</th>
                  </tr>
                </thead>

                <tbody>
                  <tr th:each="mozi : ${mozik}">
                    <td th:text="${mozi.id}"></td>
                    <td th:text="${mozi.nev}"></td>
                    <td th:text="${mozi.varos}"></td>
                    <td th:text="${mozi.ferohely}"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <h3>Előadások</h3>

            <p>Az első 50 rekord jelenik meg.</p>

            <div class="table-wrapper scroll">
              <table>
                <thead>
                  <tr>
                    <th>Film ID</th>
                    <th>Mozi ID</th>
                    <th>Dátum</th>
                    <th>Nézőszám</th>
                    <th>Bevétel</th>
                  </tr>
                </thead>

                <tbody>
                  <tr th:each="eloadas : ${eloadasok}">
                    <td th:text="${eloadas.id.filmid}"></td>
                    <td th:text="${eloadas.id.moziid}"></td>
                    <td th:text="${eloadas.id.datum}"></td>
                    <td th:text="${eloadas.nezoszam}"></td>
                    <td th:text="${eloadas.bevetel}"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>

      <div th:replace="~{footer :: footer}"></div>
    </div>

    <div th:replace="~{scripts :: scripts}"></div>
  </body>
</html>
