<!doctype html>
<html
  lang="hu"
  xmlns:th="http://www.thymeleaf.org"
>
  <head th:replace="~{head :: head('MoziDB - Film CRUD')}"></head>

  <body class="is-preload">
    <div id="page-wrapper">
      <div id="header-wrapper">
        <div th:replace="~{menu :: menu}"></div>
      </div>

      <div id="main-wrapper">
        <div class="container">
          <section class="box last">
            <header class="page-header">
              <h2>Film CRUD</h2>

              <p>Ezt az oldalt csak Admin felhasználó érheti el.</p>
            </header>

            <p
              class="alert success"
              th:if="${uzenet}"
              th:text="${uzenet}"
            ></p>

            <p>
              <a
                th:href="@{/crud/uj}"
                class="button icon solid fa-plus"
              >
                Új film hozzáadása
              </a>
            </p>

            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Cím</th>
                    <th>Év</th>
                    <th>Hossz</th>
                    <th>Műveletek</th>
                  </tr>
                </thead>

                <tbody>
                  <tr th:each="film : ${filmek}">
                    <td th:text="${film.id}"></td>

                    <td th:text="${film.cim}"></td>

                    <td th:text="${film.ev}"></td>

                    <td th:text="${film.hossz}"></td>

                    <td class="actions">
                      <a
                        th:href="@{/crud/modosit/{id}(id=${film.id})}"
                        class="button small alt"
                      >
                        Módosítás
                      </a>

                      <form
                        th:action="@{/crud/torol/{id}(id=${film.id})}"
                        method="post"
                      >
                        <button
                          type="submit"
                          class="small danger"
                        >
                          Törlés
                        </button>
                      </form>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>

      <div th:replace="~{footer :: footer}"></div>
    </div>

    <div th:replace="~{scripts :: scripts}"></div>
  </body>
</html>
