<!doctype html>
<html
  lang="hu"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head th:replace="~{head :: head('MoziDB - Üzenetek')}"></head>

  <body class="is-preload">
    <div id="page-wrapper">
      <div id="header-wrapper">
        <div th:replace="~{menu :: menu}"></div>
      </div>

      <div id="main-wrapper">
        <div class="container">
          <section class="box last">
            <header class="page-header">
              <h2>Üzenetek</h2>

              <p>
                Bejelentkezve:
                <strong sec:authentication="name"></strong>
              </p>
            </header>

            <p
              class="alert info"
              th:if="${#lists.isEmpty(uzenetek)}"
            >
              Még nincs elküldött üzenet.
            </p>

            <div
              class="table-wrapper"
              th:if="${!#lists.isEmpty(uzenetek)}"
            >
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Név</th>
                    <th>E-mail</th>
                    <th>Üzenet</th>
                    <th>Küldés ideje</th>
                  </tr>
                </thead>

                <tbody>
                  <tr th:each="uzenet : ${uzenetek}">
                    <td th:text="${uzenet.id}"></td>
                    <td th:text="${uzenet.nev}"></td>
                    <td th:text="${uzenet.email}"></td>
                    <td th:text="${uzenet.uzenet}"></td>

                    <td
                      th:text="${#temporals.format(
                              uzenet.kuldesIdeje,
                              'yyyy.MM.dd. HH:mm:ss'
                      )}"
                    ></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </div>

      <div th:replace="~{footer :: footer}"></div>
    </div>

    <div th:replace="~{scripts :: scripts}"></div>
  </body>
</html>
