<!doctype html>
<html
  lang="hu"
  xmlns:th="http://www.thymeleaf.org"
>
  <head th:replace="~{head :: head('MoziDB - Kapcsolat')}"></head>

  <body class="is-preload">
    <div id="page-wrapper">
      <div id="header-wrapper">
        <div th:replace="~{menu :: menu}"></div>
      </div>

      <div id="main-wrapper">
        <div class="container">
          <section class="box last">
            <header class="page-header">
              <h2>Kapcsolat</h2>

              <p>Ha kérdésed vagy észrevételed van, küldj üzenetet.</p>
            </header>

            <p
              class="alert success"
              th:if="${siker}"
              th:text="${siker}"
            ></p>

            <form
              th:action="@{/kapcsolat}"
              th:object="${kapcsolatForm}"
              method="post"
            >
              <div class="row gtr-50">
                <div class="col-6 col-12-small">
                  <div class="field">
                    <label for="nev">Név</label>

                    <input
                      id="nev"
                      type="text"
                      th:field="*{nev}"
                    />

                    <div
                      class="field-error"
                      th:if="${#fields.hasErrors('nev')}"
                      th:errors="*{nev}"
                    ></div>
                  </div>
                </div>

                <div class="col-6 col-12-small">
                  <div class="field">
                    <label for="email">E-mail cím</label>

                    <input
                      id="email"
                      type="email"
                      th:field="*{email}"
                    />

                    <div
                      class="field-error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"
                    ></div>
                  </div>
                </div>

                <div class="col-12">
                  <div class="field">
                    <label for="uzenet">Üzenet</label>

                    <textarea
                      id="uzenet"
                      th:field="*{uzenet}"
                      rows="8"
                    ></textarea>

                    <div
                      class="field-error"
                      th:if="${#fields.hasErrors('uzenet')}"
                      th:errors="*{uzenet}"
                    ></div>
                  </div>
                </div>

                <div class="col-12">
                  <button type="submit">Üzenet küldése</button>
                </div>
              </div>
            </form>
          </section>
        </div>
      </div>

      <div th:replace="~{footer :: footer}"></div>
    </div>

    <div th:replace="~{scripts :: scripts}"></div>
  </body>
</html>
