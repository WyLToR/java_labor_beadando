<!doctype html>
<html
  lang="hu"
  xmlns:th="http://www.thymeleaf.org"
>
  <head
    th:replace="~{head :: head(${modositas}
        ? 'MoziDB - Film módosítása'
        : 'MoziDB - Új film')}"
  ></head>

  <body class="is-preload">
    <div id="page-wrapper">
      <div id="header-wrapper">
        <div th:replace="~{menu :: menu}"></div>
      </div>

      <div id="main-wrapper">
        <div class="container">
          <section class="box last">
            <header class="page-header">
              <h2
                th:text="${modositas}
                    ? 'Film módosítása'
                    : 'Új film hozzáadása'"
              ></h2>
            </header>

            <form
              class="form-narrow"
              th:object="${film}"
              th:action="${modositas}
                    ? @{/crud/modosit}
                    : @{/crud/ment}"
              method="post"
            >
              <div class="field">
                <label for="id">ID</label>

                <input
                  id="id"
                  type="number"
                  th:field="*{id}"
                  th:readonly="${modositas}"
                  required
                />
              </div>

              <div class="field">
                <label for="cim">Cím</label>

                <input
                  id="cim"
                  type="text"
                  th:field="*{cim}"
                  required
                />
              </div>

              <div class="field">
                <label for="ev">Év</label>

                <input
                  id="ev"
                  type="number"
                  th:field="*{ev}"
                  required
                />
              </div>

              <div class="field">
                <label for="hossz">Hossz</label>

                <input
                  id="hossz"
                  type="number"
                  th:field="*{hossz}"
                  required
                />
              </div>

              <ul class="actions">
                <li>
                  <button type="submit">Mentés</button>
                </li>

                <li>
                  <a
                    th:href="@{/crud}"
                    class="button alt"
                  >
                    Vissza
                  </a>
                </li>
              </ul>
            </form>
          </section>
        </div>
      </div>

      <div th:replace="~{footer :: footer}"></div>
    </div>

    <div th:replace="~{scripts :: scripts}"></div>
  </body>
</html>
