<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <header
      id="header"
      class="container"
      th:fragment="menu"
    >
      <div id="logo">
        <h1>
          <a th:href="@{/}">MoziDB</a>
        </h1>

        <span>Java Spring Boot</span>
      </div>

      <nav id="nav">
        <ul>
          <li>
            <a th:href="@{/}">Főoldal</a>
          </li>

          <li>
            <a th:href="@{/adatbazis}">Adatbázis</a>
          </li>

          <li>
            <a th:href="@{/kapcsolat}">Kapcsolat</a>
          </li>

          <li>
            <a th:href="@{/diagram}">Diagram</a>
          </li>

          <li>
            <a th:href="@{/rest}">REST</a>
          </li>

          <li sec:authorize="isAuthenticated()">
            <a th:href="@{/uzenetek}">Üzenetek</a>
          </li>

          <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/crud}">CRUD</a>
          </li>

          <li sec:authorize="isAnonymous()">
            <a th:href="@{/login}">Bejelentkezés</a>
          </li>

          <li sec:authorize="isAnonymous()">
            <a th:href="@{/register}">Regisztráció</a>
          </li>

          <li sec:authorize="isAuthenticated()">
            <form
              id="logout-form"
              th:action="@{/logout}"
              method="post"
            >
              <button type="submit">Kijelentkezés</button>
            </form>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
