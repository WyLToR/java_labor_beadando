<!doctype html>
<html
  lang="hu"
  xmlns:th="http://www.thymeleaf.org"
>
  <head th:replace="~{head :: head('MoziDB - Diagram')}"></head>

  <body class="is-preload">
    <div id="page-wrapper">
      <div id="header-wrapper">
        <div th:replace="~{menu :: menu}"></div>
      </div>

      <div id="main-wrapper">
        <div class="container">
          <section class="box last">
            <header class="page-header">
              <h2>Mozik bevétele</h2>

              <p>
                Az ábra a mozik összesített bevételét mutatja az adatbázisban
                szereplő előadások alapján.
              </p>
            </header>

            <div class="chart-scroll">
              <div class="chart-container">
                <canvas id="bevetelDiagram"></canvas>
              </div>
            </div>
          </section>
        </div>
      </div>

      <div th:replace="~{footer :: footer}"></div>
    </div>

    <div th:replace="~{scripts :: scripts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">

      const mozik =
          /*[[${mozik}]]*/ [];

      const bevetelek =
          /*[[${bevetelek}]]*/ [];

      const ctx =
          document.getElementById('bevetelDiagram');

      new Chart(ctx, {

          type: 'bar',

          data: {

              labels: mozik,

              datasets: [{
                  label: 'Összes bevétel',
                  data: bevetelek
              }]
          },

          options: {

              responsive: true,

              plugins: {

                  legend: {
                      display: true
                  },

                  title: {
                      display: true,
                      text: 'Mozik összes bevétele'
                  }
              },

              scales: {

                  y: {
                      beginAtZero: true
                  }
              }
          }
      });

    </script>
  </body>
</html>
