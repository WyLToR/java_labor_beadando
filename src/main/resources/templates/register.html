<!doctype html>
<html
  lang="hu"
  xmlns:th="http://www.thymeleaf.org"
>
  <head th:replace="~{head :: head('MoziDB - Regisztráció')}"></head>

  <body class="is-preload">
    <div id="page-wrapper">
      <div id="header-wrapper">
        <div th:replace="~{menu :: menu}"></div>
      </div>

      <div id="main-wrapper">
        <div class="container">
          <section class="box last">
            <header class="page-header">
              <h2>Regisztráció</h2>
            </header>

            <p
              class="alert error form-narrow"
              th:if="${error}"
              th:text="${error}"
            ></p>

            <form
              class="form-narrow"
              th:action="@{/register}"
              method="post"
            >
              <div class="field">
                <label for="username">Felhasználónév</label>

                <input
                  id="username"
                  type="text"
                  name="username"
                  required
                />
              </div>

              <div class="field">
                <label for="password">Jelszó</label>

                <input
                  id="password"
                  type="password"
                  name="password"
                  required
                />
              </div>

              <button type="submit">Regisztráció</button>
            </form>

            <p style="margin-top: 2em">
              Már van fiókod?
              <a th:href="@{/login}">Bejelentkezés</a>
            </p>
          </section>
        </div>
      </div>

      <div th:replace="~{footer :: footer}"></div>
    </div>

    <div th:replace="~{scripts :: scripts}"></div>
  </body>
</html>
